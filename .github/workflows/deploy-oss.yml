name: Deploy to Aliyun OSS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Aliyun CLI
        run: |
          curl -sL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz | tar xz
          sudo mv aliyun /usr/local/bin/
          aliyun --version

      - name: Configure Aliyun
        run: |
          aliyun configure set \
            --profile default \
            --mode AK \
            --region ${{ secrets.ALIYUN_OSS_REGION }} \
            --access-key-id ${{ secrets.ALIYUN_ACCESS_KEY_ID }} \
            --access-key-secret ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      - name: Upload to OSS
        run: |
          echo "=== Bucket info ==="
          echo "Bucket: ${{ secrets.ALIYUN_OSS_BUCKET }}"
          echo "Region: ${{ secrets.ALIYUN_OSS_REGION }}"
          echo ""
          echo "=== File check ==="
          ls -la index.html
          echo ""
          echo "=== Uploading... ==="
          aliyun ossutil cp index.html \
            oss://${{ secrets.ALIYUN_OSS_BUCKET }}/index.html \
            -e ${{ secrets.ALIYUN_OSS_REGION }}.aliyuncs.com \
            --force
          echo "=== Done ==="
